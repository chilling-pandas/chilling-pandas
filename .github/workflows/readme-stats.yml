name: Generate README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create directory
        run: mkdir -p profile

      # Using the ultra-stable streak stats API instead
      - name: Download SVG Cards
        run: |
          curl "https://herokuapp.com" -o profile/stats.svg
          curl "https://vercel.app" -o profile/langs.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add profile/*.svg
          git commit -m "Update profile readme stats SVGs with reliable sources" || exit 0
          git push
