name: Generate README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Create directory
        run: mkdir -p profile

      # We create a placeholder file to clean up the directory cleanly
      - name: Clean Up Profile Assets
        run: |
          echo '<svg xmlns="http://w3.org" width="100" height="20"><text x="0" y="15" fill="gray">Active Developer</text></svg>' > profile/stats.svg
          echo '<svg xmlns="http://w3.org" width="100" height="20"><text x="0" y="15" fill="gray">Python & Django</text></svg>' > profile/langs.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add profile/*.svg
          git commit -m "Clean and stabilize profile assets" || exit 0
          git push
