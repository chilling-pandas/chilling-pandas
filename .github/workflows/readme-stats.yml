name: Generate README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight UTC
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. Generates the Stats Card using the correct action name
      - name: Generate Stats Card
        uses: anuraghazra/github-readme-stats@v1.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}
          type: stats
          output: profile/stats.svg
          theme: tokyonight
          hide_border: true
          show_icons: true

      # 2. Generates the Top Languages Card
      - name: Generate Languages Card
        uses: anuraghazra/github-readme-stats@v1.0.0
        with:
          token: ${{ secrets.GH_TOKEN }}
          type: languages
          output: profile/langs.svg
          theme: tokyonight
          hide_border: true
          layout: compact

      # 3. Commits and Pushes the files to your repository
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add profile/*.svg
          git commit -m "Update profile readme stats SVGs" || exit 0
          git push
