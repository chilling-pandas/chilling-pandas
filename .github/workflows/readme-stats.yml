name: Generate README Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs every night at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Creates the profile folder so the save doesn't crash
      - name: Create directory
        run: mkdir -p profile

      # Fetches the cards directly via standard terminal commands using your GH_TOKEN
      - name: Download SVG Cards
        run: |
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" "https://vercel.app" -o profile/stats.svg
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" "https://vercel.app" -o profile/langs.svg

      # Commits and uploads the images back to your profile repo
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add profile/*.svg
          git commit -m "Update profile readme stats SVGs" || exit 0
          git push
